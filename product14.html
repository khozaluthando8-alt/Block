<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Configuration | KHOZA.IO</title>
<style>
        /* Glassmorphism Configuration[cite: 12] */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.3);
            --header-blue: rgba(227, 242, 253, 0.8);
            --accent-blue: #007bff;
            --text-main: #212529;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        body { 
            background: #ffffff; /* Keeping the white background as requested[cite: 12] */
            background-image: radial-gradient(circle at 50% 50%, #f0f7ff 0%, #ffffff 100%);
            color: var(--text-main); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Glass Header[cite: 12] */
        .shop-header {
            padding: 25px 5%;
            background: var(--header-blue);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo { height: 50px; }

        .status-info h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #0056b3;
            letter-spacing: 1px;
        }

        #connectionStatus {
            margin: 3px 0 0;
            font-size: 0.7rem;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .cart-link { 
            margin-left: auto; 
            color: var(--accent-blue); 
            text-decoration: none; 
            font-size: 0.75rem; 
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border); 
            padding: 8px 15px; 
            backdrop-filter: blur(4px);
            border-radius: 8px;
        }

        .container { 
            flex: 1;
            max-width: 1100px; 
            margin: 60px auto; 
            padding: 0 20px;
        }

        /* Glass Panel for Content[cite: 12] */
        .product-grid { 
            display: grid; 
            grid-template-columns: 1.1fr 0.9fr; 
            gap: 40px; 
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .slider-viewport { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            overflow: hidden; 
            position: relative; 
        }

        .slider-wrapper { display: flex; height: 100%; }
        .slider-item { min-width: 100%; display: flex; align-items: center; justify-content: center; }
        .slider-item img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .nav-btn { 
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--glass-border);
            color: var(--accent-blue);
            padding: 6px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
        }

        .price-tag { font-size: 2.5rem; color: #1e7e34; margin: 20px 0; font-weight: bold; }
        
        /* Inner Glass Box[cite: 12] */
        .quote-box { 
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            padding: 25px; 
            border-radius: 15px;
        }

        select, input { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
        }

        .buy-button { 
            width: 100%; 
            padding: 20px; 
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: #fff; 
            border: none; 
            border-radius: 12px;
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: 0.3s;
        }

        .buy-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4); }

        .shop-footer {
            padding: 50px 0;
            text-align: center;
            background: var(--header-blue);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            color: #555;
            font-size: 0.75rem;
        }

        @media (max-width: 850px) { 
            .product-grid { grid-template-columns: 1fr; padding: 20px; } 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="cart-logic.js"></script>

</head>
<body>

    <header class="shop-header">
        <div class="header-content">
            <img src="301015489_443828151102927_1957794053294967618_n.png" alt="LOGO" class="logo">
            <div class="status-info">
                <h1>Order Configuration</h1>
                <p id="connectionStatus" style="font-size:0.6rem; color:var(--accent-blue)">NODE: CONNECTED</p>
            </div>
            <a href="cart10.html" class="cart-link">CART: [<span id="cartCount">0</span>]</a>
        </div>
    </header>

    <div id="productDetail">
    <p style="text-align:center">Loading Secure Ledger...</p>
</div>

<div style="text-align: center; margin: 20px;">
    <button id="addUnitBtn" style="display:none; padding: 10px; cursor: pointer;">+ Add Another Unit</button>
</div>

    <footer class="shop-footer">
        <p>&copy; 2026 KHOZA.IO - Logistics Network [Parlock/Pinetown/Durban][cite: 1]</p>
    </footer>

   
</body>
</html>
